<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.groq.com https://generativelanguage.googleapis.com; img-src 'self' data: https:; font-src 'self' data:;">
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a saved override before the first paint. CSS follows the device by default.
      try {
        const theme = localStorage.getItem('trackit.theme');
        if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
      } catch { /* Browser storage is optional. */ }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
